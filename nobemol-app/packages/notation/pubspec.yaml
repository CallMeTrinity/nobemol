name: notation
description: "Moteur de rendu de notation musicale pour Flutter."
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.7
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  # Licences des polices, à afficher par l'appli qui utilise le package :
  # packages/notation/fonts/OFL.txt (Bravura), Edwin-OFL.txt.
  assets:
    - fonts/OFL.txt
    - fonts/Edwin-OFL.txt

  # Bravura (SMuFL), licence SIL OFL (fonts/OFL.txt).
  # Mise à jour : dart run tool/bravura.dart
  fonts:
    - family: Bravura
      fonts:
        - asset: fonts/Bravura.otf
    # Edwin Italic (MuseScore), licence SIL OFL (fonts/Edwin-OFL.txt), pour
    # les termes. Mise à jour : dart run tool/edwin.dart
    - family: Edwin
      fonts:
        - asset: fonts/Edwin-Italic.otf
          style: italic
