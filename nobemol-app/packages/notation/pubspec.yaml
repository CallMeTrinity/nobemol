name: notation
description: "Moteur de rendu de notation musicale pour Flutter."
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.7
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  # Bravura (SMuFL), licence SIL OFL (fonts/OFL.txt).
  # Mise à jour : dart run tool/bravura.dart
  fonts:
    - family: Bravura
      fonts:
        - asset: fonts/Bravura.otf
