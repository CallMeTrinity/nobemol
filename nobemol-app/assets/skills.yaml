# Arbre de compétences. Chaque leçon en cite au moins une (skills).
#
# requires : compétences à maîtriser avant. Un prérequis est toujours déclaré
# plus haut dans le fichier : l'ordre du fichier est un ordre d'apprentissage,
# et c'est lui qui range les leçons dans l'appli.

- id: note-reading.treble
  title: Lire en clé de sol

- id: note-reading.bass
  title: Lire en clé de fa
  requires: [note-reading.treble]

- id: note-reading.ledger-lines
  title: Lire les lignes supplémentaires
  requires: [note-reading.treble]

- id: note-reading.accidentals
  title: Lire les altérations
  requires: [note-reading.treble]

- id: note-reading.grand
  title: Lire la grande portée
  requires: [note-reading.bass, note-reading.ledger-lines]

- id: note-reading.phrases
  title: Lire une courte phrase en mesures
  requires: [note-reading.treble]

- id: note-reading.key-signatures
  title: Lire avec une armure
  requires: [note-reading.phrases, note-reading.accidentals]

- id: note-reading.alto
  title: Lire en clé d'ut 3e ligne
  requires: [note-reading.treble]

- id: note-reading.tenor
  title: Lire en clé d'ut 4e ligne
  requires: [note-reading.alto]

- id: rhythm.beats
  title: Compter les temps
  requires: [note-reading.phrases]

- id: rhythm.rests
  title: Lire les silences
  requires: [rhythm.beats]

- id: rhythm.eighths
  title: Lire les croches
  requires: [rhythm.beats]

- id: rhythm.dotted
  title: Lire les notes pointées
  requires: [rhythm.eighths]

- id: rhythm.ties
  title: Lire les liaisons de prolongation
  requires: [rhythm.beats]

- id: rhythm.sixteenths
  title: Lire les doubles croches
  requires: [rhythm.dotted]

- id: terms.dynamics
  title: Lire les nuances
  requires: [note-reading.phrases]

- id: terms.dynamic-changes
  title: Lire les crescendos et les diminuendos
  requires: [terms.dynamics]

- id: symbols.articulations
  title: Lire les articulations
  requires: [rhythm.beats]

- id: terms.tempo
  title: Lire les termes de mouvement
  requires: [rhythm.beats]

- id: terms.character
  title: Lire les termes de caractère
  requires: [terms.dynamics]
