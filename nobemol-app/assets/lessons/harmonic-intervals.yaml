id: harmonic-intervals
title: Les intervalles en accords
skills: [intervals.harmonic]
level: 4
theory:
  - text: >-
      Deux notes jouées ensemble s'écrivent l'une au-dessus de l'autre, sur
      une seule hampe. C'est un intervalle harmonique. Il se compte pareil,
      du grave à l'aigu.
    abc: |
      X:1
      L:1/1
      K:C
      [CE] [CG] [Cc]
  - text: >-
      Une seconde ne tient pas d'un seul côté de la hampe. Les deux têtes
      se posent de part et d'autre.
    abc: |
      X:1
      L:1/4
      K:C
      [EF] [GA] [de]
  - text: >-
      Les altérations ne changent pas le numéro. Do et mi bémol, do et mi :
      ce sont deux tierces.
    abc: |
      X:1
      L:1/1
      K:C
      [C_E] [CE]
exercise:
  type: identify-interval
  abc: |
    X:1
    M:4/4
    L:1/2
    K:C
    [CE] [DA] | [EF] [Ge] | [Ac] [^FB] | [CB] [Cc] |]
  targets:
    - { measure: 1, event: 1 }
    - { measure: 1, event: 2 }
    - { measure: 2, event: 1 }
    - { measure: 2, event: 2 }
    - { measure: 3, event: 1 }
    - { measure: 3, event: 2 }
    - { measure: 4, event: 1 }
    - { measure: 4, event: 2 }
