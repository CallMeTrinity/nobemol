id: beats
title: Compter les temps
skills: [rhythm.beats]
level: 2
theory:
  - text: >-
      Le temps est la pulsation régulière de la musique, celle qu'on bat du
      pied. En 4/4, chaque mesure compte quatre temps, et la noire dure un
      temps.
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      G G G G | G G G G |]
  - text: >-
      La blanche dure deux temps, la ronde quatre. Dans chaque mesure, les
      durées s'additionnent pour faire quatre temps.
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      G4 | G2 G2 | G G G2 |]
  - text: >-
      Le chiffre du haut donne le nombre de temps. Le chiffre du bas, 4, dit
      que le temps est une noire. En 3/4, une blanche et une noire
      remplissent la mesure.
    abc: |
      X:1
      M:3/4
      L:1/4
      K:C
      G2 G | G G G | G2 G |]
exercise:
  type: identify-duration
  abc: |
    X:1
    M:4/4
    L:1/4
    K:C
    C2 E G | c4 | B A G2 |]
  targets:
    - { measure: 1, event: 1 }
    - { measure: 1, event: 2 }
    - { measure: 2, event: 1 }
    - { measure: 3, event: 1 }
    - { measure: 3, event: 3 }
