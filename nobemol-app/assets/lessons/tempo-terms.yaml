id: tempo-terms
title: Les termes de mouvement
skills: [terms.tempo]
level: 3
theory:
  - text: >-
      Certains termes changent la vitesse en cours de route. Ils s'écrivent
      en italique, au-dessus de la portée. Rit. (ritardando) : en
      ralentissant. Rall. (rallentando) veut dire la même chose.
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      G A B c | "^rit." d c B A | G4 |]
  - text: >-
      Accel. (accelerando) : en accélérant.
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      "^accel." C D E F | G A B c |]
  - text: >-
      A tempo : on reprend le mouvement d'avant, après un rit. ou un accel.
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      "^rit." c B A G | "^a tempo" c B A G |]
exercise:
  type: identify-marking
  abc: |
    X:1
    M:4/4
    L:1/4
    K:C
    "^accel." C E G c | "^a tempo" e d c B |
    "^rall." A G F E | "^a tempo" D2 C2 |]
  targets:
    - { measure: 1, event: 1 }
    - { measure: 2, event: 1 }
    - { measure: 3, event: 1 }
    - { measure: 4, event: 1 }
  choices: [ritardando, accelerando, a-tempo]
