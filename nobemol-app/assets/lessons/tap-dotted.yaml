id: tap-dotted
title: Taper les notes pointées et liées
skills: [rhythm.tap-dotted]
level: 1
theory:
  - text: >-
      Une noire pointée dure un temps et demi. La croche qui la suit tombe
      sur le « et » du deuxième temps, juste avant le clic suivant.
    abc: |
      X:1
      M:4/4
      L:1/8
      K:C
      B3 B B2 B2 | B3 B B4 |]
  - text: >-
      Une liaison prolonge la note : on ne tape pas la note d'arrivée. On la
      tient, et on attend la note suivante.
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      B B-B B | B4 |]
  - text: >-
      La liaison peut traverser la barre de mesure. Le premier temps de la
      mesure passe alors sans touche.
    abc: |
      X:1
      M:4/4
      L:1/4
      K:C
      B B B B- | B B B2 |]
exercise:
  type: tap-rhythm
  tempo: 66
  phrases:
    - |
      X:1
      M:4/4
      L:1/8
      K:C
      B3 B B2 B2 | B3 B B4 |]
    - |
      X:1
      M:3/4
      L:1/8
      K:C
      B4 B2 | B3 B B2 | B6 |]
    - |
      X:1
      M:4/4
      L:1/4
      K:C
      B B-B B | B2 B2 |]
    - |
      X:1
      M:4/4
      L:1/4
      K:C
      B B B B- | B B B2 |]
    - |
      X:1
      M:4/4
      L:1/8
      K:C
      B3 B B2 z2 | B2 B2- B B B2 |]
