name: Flutter

on:
  push:
    branches: [main]
    paths: ['nobemol-app/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['nobemol-app/**', '.github/workflows/flutter.yml']

defaults:
  run:
    working-directory: nobemol-app

jobs:
  check:
    # Image figée : les golden tests dépendent du rendu des polices.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Version de Flutter figée : la même qu'en local (voir nobemol-app/README.md).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - name: Tests du package notation
        run: flutter test
        working-directory: nobemol-app/packages/notation

      - name: Tests de l'appli
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: nobemol-apk
          path: nobemol-app/build/app/outputs/flutter-apk/app-release.apk
