name: Flutter

on:
  push:
    branches: [main]
    paths: ['nobemol-app/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['nobemol-app/**', '.github/workflows/flutter.yml']
  # Appelé par release.yml : même vérification, APK signé obligatoire.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

defaults:
  run:
    working-directory: nobemol-app

jobs:
  check:
    # Image figée : les golden tests dépendent du rendu des polices.
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Version de Flutter figée : la même qu'en local (voir nobemol-app/README.md).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      # NDK exigé par Flutter (flutter.ndkVersion), absent de l'image
      # ubuntu-24.04 (27.3, 29.0, 30.0). Sans ces deux steps, Gradle le
      # télécharge en plein build et l'extraction échoue par moments.
      # À changer avec la version de Flutter.
      - name: Cache du NDK
        id: ndk-cache
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Installation du NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        env:
          SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        run: |
          for attempt in 1 2 3; do
            yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" > /dev/null && exit 0
            echo "Échec de l'installation du NDK (tentative $attempt)"
            rm -rf "/usr/local/lib/android/sdk/ndk/$NDK_VERSION"
          done
          exit 1

      - run: flutter pub get

      - run: flutter analyze

      # Leçons et arbre de compétences : schéma, ABC, compétences citées.
      - name: Validation du contenu
        run: dart run tool/validate_content.dart

      - name: Tests du package notation
        run: flutter test
        working-directory: nobemol-app/packages/notation

      - name: Tests de l'appli
        run: flutter test

      # Clé de release depuis les secrets (voir README.md, Releases). Sans
      # secrets (PR d'un fork), l'APK est signé en debug, sauf pour une
      # release : un APK debug ne s'installe pas par-dessus la version d'avant.
      - name: Clé de signature
        env:
          RELEASE: ${{ inputs.release || false }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$RELEASE" = true ]; then
              echo "::error::Secrets de signature absents, release impossible"
              exit 1
            fi
            echo "Pas de clé de release : APK signé en debug"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: nobemol-apk
          path: nobemol-app/build/app/outputs/flutter-apk/app-release.apk
